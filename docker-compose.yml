services:
  db:
    image: pgvector/pgvector:pg16
    container_name: ecoreason-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ecoreason
      POSTGRES_PASSWORD: ecoreason
      POSTGRES_DB: ecoreason
    ports:
      - "5433:5432"
    volumes:
      - ecoreason_pgdata:/var/lib/postgresql/data
volumes:
  ecoreason_pgdata:
